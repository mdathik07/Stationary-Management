spring.application.name=PrintXchange

# ===== Database (override via env vars; see README) =====
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/printxchange?useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

# ===== Seeded admin account (change these in production!) =====
app.admin.email=${ADMIN_EMAIL:admin@printxchange.local}
app.admin.password=${ADMIN_PASSWORD:changeme123}
app.admin.name=${ADMIN_NAME:Shop Admin}

# Restrict registration to a college domain, e.g. mycollege.edu (empty = any)
app.allowed-email-domain=${ALLOWED_EMAIL_DOMAIN:}

# ===== Print pricing (per page) =====
pricing.bw-per-page=${PRICE_BW_PER_PAGE:2.00}
pricing.color-per-page=${PRICE_COLOR_PER_PAGE:10.00}

# ===== File Upload Size Limit =====
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# ===== Server =====
server.port=${PORT:8081}

# ===== Actuator (health check for hosting platforms) =====
management.endpoints.web.exposure.include=health
