<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page page-narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="flash flash-error" th:if="${param.error}">Invalid email or password.</div>
    <div class="flash flash-success" th:if="${param.logout}">You have been logged out.</div>

    <div class="card">
        <h2>Welcome back</h2>
        <p class="subtitle">Log in to place and track your orders.</p>
        <form th:action="@{/login}" method="post" class="stacked">
            <label for="username">Email</label>
            <input type="email" id="username" name="username" placeholder="you@college.edu" required autofocus/>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your password" required/>
            <button type="submit" class="btn" style="margin-top:16px">Login</button>
        </form>
        <p style="text-align:center; margin-bottom:0">
            Don't have an account? <a th:href="@{/register}">Register</a>
        </p>
    </div>
</div>

</body>
</html>
