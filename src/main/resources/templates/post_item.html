<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Post an Item')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<div class="page page-narrow">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="card">
        <h2>➕ Post an Item</h2>
        <p class="subtitle">Sell or give away stationery you no longer need.</p>

        <form th:action="@{/student/post-item}" method="post" enctype="multipart/form-data" class="stacked">
            <label for="itemName">Item name</label>
            <input type="text" id="itemName" name="itemName" placeholder="e.g. Casio FX-991 Calculator" required maxlength="100"/>

            <label for="category">Category</label>
            <select id="category" name="category">
                <option value="">— Select —</option>
                <option>Books</option>
                <option>Notes</option>
                <option>Calculator</option>
                <option>Drafter / Drawing kit</option>
                <option>Lab Coat</option>
                <option>Other</option>
            </select>

            <label for="price">Asking price (₹, leave blank for negotiable)</label>
            <input type="number" id="price" name="price" min="0" step="0.5" placeholder="e.g. 500"/>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" maxlength="1000"
                      placeholder="Condition, edition, how old it is…"></textarea>

            <label for="photo">Photo (optional, JPG/PNG)</label>
            <input type="file" id="photo" name="photo" accept="image/jpeg,image/png,image/webp"/>

            <button type="submit" class="btn" style="margin-top:16px">Post Item</button>
        </form>
    </div>
</div>

</body>
</html>
